name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"

      - name: PyInstaller
        run: pyinstaller packaging/transcritor.spec --noconfirm --distpath dist --workpath build

      - name: Instalador Windows (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path src/transcritor/__init__.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\installer.iss

      - name: Instalador macOS (DMG)
        if: runner.os == 'macOS'
        run: packaging/macos/build_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Transcritor-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*

name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"
          if [ "$RUNNER_OS" = "macOS" ]; then pip install --no-deps "mlx-whisper==0.4.3"; fi

      - name: PyInstaller
        run: pyinstaller packaging/transcritor.spec --noconfirm --distpath dist --workpath build

      - name: Teste real com o app empacotado
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE=dist/Transcritor/Transcritor.exe
            LOG="$LOCALAPPDATA/Transcritor/transcritor.log"
          else
            EXE=dist/Transcritor.app/Contents/MacOS/Transcritor
            LOG=/dev/null
          fi
          mkdir -p smoke
          if ! "$EXE" --cli tests/fixtures/reuniao.mp4 --modelo small --formatos txt,docx,srt --saida smoke; then
            cat "$LOG" || true
            exit 1
          fi
          cat "$LOG" || true
          cat smoke/reuniao.txt
          test -s smoke/reuniao.docx && test -s smoke/reuniao.srt
          grep -q "Falante 2" smoke/reuniao.txt
          grep -qi "trimestre" smoke/reuniao.txt
          # Player (Qt Multimedia empacotado): clicar no horário de uma fala toca o áudio
          "$EXE" --cli --testar-audio tests/fixtures/reuniao.mp4 || { cat "$LOG"; exit 1; }
          cat "$LOG" || true
          # Parakeet (opção Ultrarrápido e transcrição ao vivo)
          mkdir -p smoke-pk
          "$EXE" --cli tests/fixtures/reuniao.mp4 --modelo parakeet --formatos txt --saida smoke-pk || { cat "$LOG"; exit 1; }
          cat smoke-pk/reuniao.txt
          grep -q "Falante 2" smoke-pk/reuniao.txt
          grep -qi "trimestre" smoke-pk/reuniao.txt

      - name: Teste de download (manifesto DASH, mesmo caminho das gravações do Teams)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE=dist/Transcritor/Transcritor.exe
            LOG="$LOCALAPPDATA/Transcritor/transcritor.log"
          else
            EXE=dist/Transcritor.app/Contents/MacOS/Transcritor
            LOG=/dev/null
          fi
          mkdir -p smoke-dl
          "$EXE" --cli "https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd" --sem-falantes --modelo small --formatos txt --saida smoke-dl || { cat "$LOG"; exit 1; }
          cat "$LOG" || true
          ls -la smoke-dl
          test -s smoke-dl/gravacao.m4a

      - name: Placa de som virtual (Windows)
        if: runner.os == 'Windows'
        uses: LABSN/sound-ci-helpers@v1

      - name: Teste de gravação de reunião (Windows, tela 1 + som do computador + ao vivo)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import imageio_ffmpeg,subprocess;subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-hide_banner','-loglevel','error','-y','-i','tests/fixtures/reuniao.mp4','-ac','2','-ar','48000','fala.wav'],check=True)"
          New-Item -ItemType Directory -Force smoke-rec | Out-Null
          $log = "$env:LOCALAPPDATA\Transcritor\transcritor.log"
          Start-Process -FilePath dist\Transcritor\Transcritor.exe -Wait -ArgumentList '--cli','--dispositivos'
          Get-Content $log -ErrorAction SilentlyContinue
          if (-not (Select-String -Path $log -Pattern 'Tela 1' -Quiet)) { Write-Error "sem lista de telas"; exit 1 }
          $p = Start-Process -FilePath dist\Transcritor\Transcritor.exe -PassThru -ArgumentList '--cli','--gravar','60','--tela','1','--ao-vivo','--modelo','small','--formatos','txt','--saida','smoke-rec'
          Start-Sleep -Seconds 12
          (New-Object Media.SoundPlayer "$PWD\fala.wav").PlaySync()
          $p.WaitForExit()
          Get-Content $log -ErrorAction SilentlyContinue
          Get-ChildItem smoke-rec
          Get-Content smoke-rec\*.txt
          if (-not (Get-ChildItem smoke-rec\*.mp4)) { Write-Error "sem vídeo"; exit 1 }
          if (-not (Select-String -Path smoke-rec\*.txt -Pattern 'trimestre' -Quiet)) { Write-Error "sem transcrição"; exit 1 }
          if (-not (Select-String -Path $log -Pattern 'ao vivo.*Participantes' -Quiet)) { Write-Error "sem transcrição ao vivo"; exit 1 }

      - name: Instalador Windows (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path src/transcritor/__init__.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\installer.iss

      - name: Instalador macOS (DMG)
        if: runner.os == 'macOS'
        run: packaging/macos/build_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Transcritor-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*

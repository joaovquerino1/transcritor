[project]
name = "transcritor"
version = "1.0.0"
description = "Transcrição de vídeos com identificação de falantes, usando modelos de IA gratuitos e locais."
requires-python = ">=3.10,<3.14"
dependencies = [
    "faster-whisper>=1.2",
    "sherpa-onnx>=1.12",
    "av>=14",
    "numpy>=1.26",
    "PySide6-Essentials>=6.7",
    "python-docx>=1.1",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10", "pillow>=10"]

[project.gui-scripts]
transcritor = "transcritor.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

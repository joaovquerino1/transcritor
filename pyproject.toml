[project]
name = "transcritor"
version = "1.6.0"
description = "Transcrição de vídeos com identificação de falantes, usando modelos de IA gratuitos e locais."
requires-python = ">=3.10,<3.14"
dependencies = [
    "faster-whisper>=1.2",
    "sherpa-onnx>=1.12",
    "av>=14",
    "numpy>=1.26",
    "PySide6-Essentials>=6.7",
    "PySide6-WebEngine>=6.10",
    "yt-dlp[default]>=2025.11",
    "deno>=2.5",                       # resolve os desafios de JavaScript do YouTube
    "imageio-ffmpeg>=0.5",
    "python-docx>=1.1",
    "huggingface-hub>=0.25",
    "pyobjc-framework-ScreenCaptureKit>=11; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=11; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=11; sys_platform == 'darwin'",
    # Whisper na GPU dos Macs com Apple Silicon. O mlx-whisper é instalado à parte, sem as
    # dependências (torch, numba, scipy), que ele só usa para converter modelos.
    "mlx>=0.25; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tiktoken>=0.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "more-itertools>=10; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "soundcard>=0.4.6; sys_platform == 'win32'",
    "mss>=10; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10", "pillow>=10"]

[project.gui-scripts]
transcritor = "transcritor.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
